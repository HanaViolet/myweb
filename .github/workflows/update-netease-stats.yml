name: Update NetEase listening stats

on:
  schedule:
    # 00:17 Asia/Shanghai (UTC+8), once per day.
    - cron: '17 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netease-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install scraper dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Locate Chromium
        shell: bash
        run: |
          for candidate in /usr/bin/google-chrome-stable /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then
              echo "NETEASE_BROWSER_PATH=$candidate" >> "$GITHUB_ENV"
              echo "Using $candidate"
              break
            fi
          done

      - name: Fetch NetEase rankings
        env:
          NETEASE_COOKIE: ${{ secrets.NETEASE_COOKIE }}
        run: node tools/update-netease-stats.mjs

      - name: Commit updated data
        id: publish
        shell: bash
        run: |
          if git diff --quiet -- source/_data/netease-stats.json; then
            echo "No NetEase data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          updated_at=$(node -p "require('./source/_data/netease-stats.json').updatedAt")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/_data/netease-stats.json
          git commit -m "chore: update NetEase listening stats"
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Push attempt ${attempt} failed; rebasing on the latest main branch."
            git pull --rebase origin main
          done
          if [ "$pushed" != "true" ]; then
            echo "Unable to push NetEase data after three attempts." >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "marker=$updated_at" >> "$GITHUB_OUTPUT"

      - name: Verify Cloudflare Pages deployment
        if: steps.publish.outputs.changed == 'true'
        env:
          CLOUDFLARE_SITE_URL: https://sakura.luxe/about/
          CLOUDFLARE_EXPECTED_MARKER: ${{ steps.publish.outputs.marker }}
        run: node tools/verify-cloudflare-deployment.mjs
