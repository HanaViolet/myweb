# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# =========================================================
# 1. 站点基本信息 (Site)
# =========================================================
title: Sakura Listening Room  # 网站标题
subtitle: 'Music for the quiet hours' # 副标题
description: 'Sakura 的私人聆听室：记录音乐、代码、游戏与生活。' # 网站描述
keywords: Vue, Hexo, Python, AI, 编程, 随笔 # 网站关键词
author: sakura                # 文章作者名
language: zh-CN               # 语言
timezone: 'Asia/Shanghai'     # 时区

# =========================================================
# 2. 网址设置 (URL) - ⚠️ 关键设置
# =========================================================
## 站点由 Cloudflare Pages 托管，域名保持为自己的正式地址
url: https://sakura.luxe
permalink: posts/:abbrlink/   # 推荐：文章链接格式 (如果没装 hexo-abbrlink 插件，请改回 :year/:month/:day/:title/)
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# =========================================================
# 3. 目录设置 (Directory)
# =========================================================
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# =========================================================
# 4. 文章写作设置 (Writing)
# =========================================================
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
# ⚠️ 资源文件夹：建议改为 true。这样新建文章时会自动创建同名文件夹用于存放图片
post_asset_folder: true
relative_link: false
future: true

# 代码高亮设置 (配合 Sakura 主题的本地渲染层)
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: true  # 本地主题的代码块样式兼容设置
prismjs:
  enable: false # 使用 highlight.js，关闭 prismjs 避免冲突
  preprocess: true
  line_number: true
  tab_replace: ''

# =========================================================
# 5. 首页分页设置 (Home page setting)
# =========================================================
index_generator:
  path: ''
  per_page: 10 # 首页每页显示多少篇文章
  order_by: -date

# =========================================================
# 6. 分类与标签 (Category & Tag)
# =========================================================
default_category: uncategorized
category_map:
tag_map:

# =========================================================
# 7. 元数据 (Metadata elements)
# =========================================================
meta_generator: true

# =========================================================
# 8. 日期时间格式 (Date / Time format)
# =========================================================
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# =========================================================
# 9. 分页 (Pagination)
# =========================================================
per_page: 10
pagination_dir: page

# =========================================================
# 10. 扩展 (Extensions)
# =========================================================
## 启用项目内独立主题
theme: sakura

# =========================================================
# 11. 部署 (Deployment)
# =========================================================
## 使用 Cloudflare Pages 自动抓取 GitHub 仓库，此处留空即可
deploy:
  type: ''

# =========================================================
# 12. 简短的 URL (Abbreviated Link)
# =========================================================
abbrlink:
  alg: crc32      # 算法：crc16(短) 或 crc32(长一点)，推荐 crc32
  rep: hex        # 进制：dec(十进制) 或 hex(十六进制)，推荐 hex

sitemap:
  path: sitemap.xml

feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
